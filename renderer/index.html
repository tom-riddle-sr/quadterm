<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>QuadTerm</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titlebar">
    <div id="tabs"></div>
    <button id="new-btn" title="開新終端 (⌘T)">＋ 新終端</button>
    <span id="auto-badge" title="滑鼠移過去自動放大（⌘⇧Z 切換）">自動放大：開</span>
    <span id="help" title="⌘T 開新終端 · ⌘W 關閉
⌘1–4 跳到第幾格 · ⌘⇧[ / ] 切換終端
⌘0 平均 · ⌘⇧↩ 這格全螢幕
⌘⇧D 拉出成獨立視窗／收回
把上方列表的終端拖到視窗外 = 拉出成獨立視窗
把列表的終端拖到某一格 = 放進那格
雙擊列表名稱可以改名">?</span>
  </div>
  <div id="grid"></div>
  <div id="offscreen"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="term-common.js"></script>
  <script src="app.js"></script>
</body>
</html>
